          <text x="208" y="78" font-size="13" fill="#ff6ec7">★</text>
          <text x="230" y="78" font-size="13.5" fill="#c9a8e8">Total Stars</text>
          <text x="456" y="78" font-size="13.5" text-anchor="end" font-weight="700" fill="#f3e8ff">48</text>
        </g><g opacity="0">
          <animate attributeName="opacity" begin="1.08s" dur="0.5s" values="0;1" fill="freeze"/>
          <animateTransform attributeName="transform" type="translate" begin="1.08s" dur="0.5s" values="30,0;0,0" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1" keyTimes="0;1"/>
          <text x="208" y="106" font-size="13" fill="#ff6ec7">◆</text>
          <text x="230" y="106" font-size="13.5" fill="#c9a8e8">Total Commits</text>
          <text x="456" y="106" font-size="13.5" text-anchor="end" font-weight="700" fill="#f3e8ff">1,240</text>
        </g><g opacity="0">
          <animate attributeName="opacity" begin="1.26s" dur="0.5s" values="0;1" fill="freeze"/>
          <animateTransform attributeName="transform" type="translate" begin="1.26s" dur="0.5s" values="30,0;0,0" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1" keyTimes="0;1"/>
          <text x="208" y="134" font-size="13" fill="#ff6ec7">⌥</text>
          <text x="230" y="134" font-size="13.5" fill="#c9a8e8">Pull Requests</text>
          <text x="456" y="134" font-size="13.5" text-anchor="end" font-weight="700" fill="#f3e8ff">36</text>
        </g><g opacity="0">
          <animate attributeName="opacity" begin="1.44s" dur="0.5s" values="0;1" fill="freeze"/>
          <animateTransform attributeName="transform" type="translate" begin="1.44s" dur="0.5s" values="30,0;0,0" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1" keyTimes="0;1"/>
          <text x="208" y="162" font-size="13" fill="#ff6ec7">✓</text>
          <text x="230" y="162" font-size="13.5" fill="#c9a8e8">Issues Resolved</text>
          <text x="456" y="162" font-size="13.5" text-anchor="end" font-weight="700" fill="#f3e8ff">22</text>
        </g><g opacity="0">
          <animate attributeName="opacity" begin="1.62s" dur="0.5s" values="0;1" fill="freeze"/>
          <animateTransform attributeName="transform" type="translate" begin="1.62s" dur="0.5s" values="30,0;0,0" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1" keyTimes="0;1"/>
          <text x="208" y="190" font-size="13" fill="#ff6ec7">■</text>
          <text x="230" y="190" font-size="13.5" fill="#c9a8e8">Repositories</text>
          <text x="456" y="190" font-size="13.5" text-anchor="end" font-weight="700" fill="#f3e8ff">17</text>
        </g>
</svg>