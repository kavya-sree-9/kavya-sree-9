<svg xmlns="http://www.w3.org/2000/svg" width="480" height="230" viewBox="0 0 480 230" font-family="'Segoe UI',Arial,sans-serif">
<defs>
<linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#180a2e"><animate attributeName="stop-color" values="#180a2e;#2a1052;#180a2e" dur="9s" repeatCount="indefinite"/></stop>
  <stop offset="100%" stop-color="#2a1052"><animate attributeName="stop-color" values="#2a1052;#180a2e;#2a1052" dur="9s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#ff6ec7"><animate attributeName="stop-color" values="#ff6ec7;#a855f7;#ff6ec7" dur="5s" repeatCount="indefinite"/></stop>
  <stop offset="100%" stop-color="#a855f7"><animate attributeName="stop-color" values="#a855f7;#e84fd9;#a855f7" dur="5s" repeatCount="indefinite"/></stop>
</linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="3" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect x="0.5" y="0.5" width="479" height="229" rx="18" fill="url(#bgGrad)" stroke="#5b2a86" stroke-width="1.2"/>
    <text x="24" y="34" font-size="17" font-weight="700" fill="#f3e8ff" font-family="'Segoe UI',Arial,sans-serif">Kavya's GitHub Stats</text>
    <line x1="24" y1="46" x2="456" y2="46" stroke="#a855f7" stroke-opacity="0.35"/>
<g transform="rotate(-90 96 138)">
  <circle cx="96" cy="138" r="58" fill="none" stroke="#3a1a5c" stroke-width="11"/>
  <circle cx="96" cy="138" r="58" fill="none" stroke="url(#barGrad)" stroke-width="11" stroke-linecap="round"
    stroke-dasharray="364.4" stroke-dashoffset="364.4" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="364.4" to="25.5" dur="1.6s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1" keyTimes="0;1"/>
  </circle>
</g>
<text x="96" y="147" text-anchor="middle" font-size="30" font-weight="800" fill="#f3e8ff" opacity="0">
  <animate attributeName="opacity" begin="1.6s" dur="0.5s" values="0;1" fill="freeze"/>
  A+
</text>
<text x="96" y="206" text-anchor="middle" font-size="11" fill="#c9a8e8"></text>
<g opacity="0">
          <animate attributeName="opacity" begin="0.90s" dur="0.5s" values="0;1" fill="freeze"/>
