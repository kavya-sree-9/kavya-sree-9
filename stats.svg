<svg xmlns="http://www.w3.org/2000/svg" width="480" height="230" viewBox="0 0 480 230" font-family="'Segoe UI',Arial,sans-serif">
<defs>
<linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#0B1120"><animate attributeName="stop-color" values="#0B1120;#121A30;#0B1120" dur="9s" repeatCount="indefinite"/></stop>
  <stop offset="100%" stop-color="#121A30"><animate attributeName="stop-color" values="#121A30;#0B1120;#121A30" dur="9s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#4169E1"><animate attributeName="stop-color" values="#4169E1;#6C8EFF;#4169E1" dur="5s" repeatCount="indefinite"/></stop>
  <stop offset="100%" stop-color="#6C8EFF"><animate attributeName="stop-color" values="#6C8EFF;#3454B4;#6C8EFF" dur="5s" repeatCount="indefinite"/></stop>
</linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="3" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect x="0.5" y="0.5" width="479" height="229" rx="18" fill="url(#bgGrad)" stroke="#3A5BA0" stroke-width="1.2"/>
    <text x="24" y="34" font-size="17" font-weight="700" fill="#EAF0FF" font-family="'Segoe UI',Arial,sans-serif">Kavya's GitHub Stats</text>
    <line x1="24" y1="46" x2="456" y2="46" stroke="#6C8EFF" stroke-opacity="0.35"/>
<g transform="rotate(-90 96 138)">
  <circle cx="96" cy="138" r="58" fill="none" stroke="#1C2B52" stroke-width="11"/>
  <circle cx="96" cy="138" r="58" fill="none" stroke="url(#barGrad)" stroke-width="11" stroke-linecap="round"
    stroke-dasharray="364.4" stroke-dashoffset="364.4" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="364.4" to="25.5" dur="1.6s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1" keyTimes="0;1"/>
  </circle>
</g>
<text x="96" y="147" text-anchor="middle" font-size="30" font-weight="800" fill="#EAF0FF" opacity="0">
  <animate attributeName="opacity" begin="1.6s" dur="0.5s" values="0;1" fill="freeze"/>
  A+
</text>
<text x="96" y="206" text-anchor="middle" font-size="11" fill="#8FADEB"></text>
<g opacity="0">
          <animate attributeName="opacity" begin="0.90s" dur="0.5s" values="0;1" fill="freeze"/>
          <animateTransform attributeName="transform" type="translate" begin="0.90s" dur="0.5s" values="30,0;0,0" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1" keyTimes="0;1"/>
          <text x="208" y="78" font-size="13" fill="#4169E1">★</text>
          <text x="230" y="78" font-size="13.5" fill="#8FADEB">Total Stars</text>
          <text x="456" y="78" font-size="13.5" text-anchor="end" font-weight="700" fill="#EAF0FF">48</text>
        </g><g opacity="0">
          <animate attributeName="opacity" begin="1.08s" dur="0.5s" values="0;1" fill="freeze"/>
          <animateTransform attributeName="transform" type="translate" begin="1.08s" dur="0.5s" values="30,0;0,0" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1" keyTimes="0;1"/>
          <text x="208" y="106" font-size="13" fill="#4169E1">◆</text>
          <text x="230" y="106" font-size="13.5" fill="#8FADEB">Total Commits</text>
          <text x="456" y="106" font-size="13.5" text-anchor="end" font-weight="700" fill="#EAF0FF">1,240</text>
        </g><g opacity="0">
          <animate attributeName="opacity" begin="1.26s" dur="0.5s" values="0;1" fill="freeze"/>
          <animateTransform attributeName="transform" type="translate" begin="1.26s" dur="0.5s" values="30,0;0,0" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1" keyTimes="0;1"/>
          <text x="208" y="134" font-size="13" fill="#4169E1">⌥</text>
          <text x="230" y="134" font-size="13.5" fill="#8FADEB">Pull Requests</text>
          <text x="456" y="134" font-size="13.5" text-anchor="end" font-weight="700" fill="#EAF0FF">36</text>
        </g><g opacity="0">
          <animate attributeName="opacity" begin="1.44s" dur="0.5s" values="0;1" fill="freeze"/>
          <animateTransform attributeName="transform" type="translate" begin="1.44s" dur="0.5s" values="30,0;0,0" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1" keyTimes="0;1"/>
          <text x="208" y="162" font-size="13" fill="#4169E1">✓</text>
          <text x="230" y="162" font-size="13.5" fill="#8FADEB">Issues Resolved</text>
          <text x="456" y="162" font-size="13.5" text-anchor="end" font-weight="700" fill="#EAF0FF">22</text>
        </g><g opacity="0">
          <animate attributeName="opacity" begin="1.62s" dur="0.5s" values="0;1" fill="freeze"/>
          <animateTransform attributeName="transform" type="translate" begin="1.62s" dur="0.5s" values="30,0;0,0" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1" keyTimes="0;1"/>
          <text x="208" y="190" font-size="13" fill="#4169E1">■</text>
          <text x="230" y="190" font-size="13.5" fill="#8FADEB">Repositories</text>
          <text x="456" y="190" font-size="13.5" text-anchor="end" font-weight="700" fill="#EAF0FF">17</text>
        </g>
</svg>