name: Generate Snake Animation

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate the pink/purple snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: kavya-sree-9
          outputs: |
            dist/github-snake.svg?color_snake=#ff6ec7,#a855f7&color_dots=#2a1052,#5b2a86,#a855f7,#e84fd9,#ff6ec7&color_dots_border=#180a2e
            dist/github-snake-light.svg?color_snake=#d6499b,#8b3fd1&color_dots=#f3d9f7,#e6b8e0,#c084fc,#c026a3,#8b3fd1&color_dots_border=#fdf2fb

      - name: Push snake output to the `output` branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
