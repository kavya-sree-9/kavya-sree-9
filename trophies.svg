<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" font-family="'Segoe UI',Arial,sans-serif">
<defs>
<linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#180a2e"><animate attributeName="stop-color" values="#180a2e;#2a1052;#180a2e" dur="9s" repeatCount="indefinite"/></stop>
  <stop offset="100%" stop-color="#2a1052"><animate attributeName="stop-color" values="#2a1052;#180a2e;#2a1052" dur="9s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#ff6ec7"><animate attributeName="stop-color" values="#ff6ec7;#a855f7;#ff6ec7" dur="5s" repeatCount="indefinite"/></stop>
  <stop offset="100%" stop-color="#a855f7"><animate attributeName="stop-color" values="#a855f7;#e84fd9;#a855f7" dur="5s" repeatCount="indefinite"/></stop>
</linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="3" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>

<clipPath id="trophyClip"><rect x="0" y="0" width="900" height="200" rx="18"/></clipPath>
<linearGradient id="shineGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#ffffff" stop-opacity="0.22"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
</defs>
<g clip-path="url(#trophyClip)">
<rect x="0" y="0" width="900" height="200" fill="url(#bgGrad)"/>
<g opacity="0">
          <animate attributeName="opacity" begin="0.30s" dur="0.45s" values="0;1" fill="freeze"/>
