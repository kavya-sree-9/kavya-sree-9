<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <clipPath id="cardClip"><rect x="0" y="0" width="1280" height="400" rx="22" ry="22"/></clipPath>

    <radialGradient id="bgGlow" cx="80%" cy="12%" r="42%">
      <stop offset="0%" stop-color="#3A5BD9" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#3A5BD9" stop-opacity="0.035"/>
      <stop offset="100%" stop-color="#3A5BD9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1E"/>
      <stop offset="55%" stop-color="#0F1830"/>
      <stop offset="100%" stop-color="#0A0F1E"/>
    </linearGradient>

    <pattern id="dotGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#4169E1" fill-opacity="0.05"/>
    </pattern>

    <linearGradient id="sigGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C8EFF" stop-opacity="0.15"/>
      <stop offset="12%" stop-color="#6C8EFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6C8EFF" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="1280" height="400" fill="url(#bgBase)"/>
    <rect x="0" y="0" width="1280" height="400" fill="url(#bgGlow)"/>
    <rect x="0" y="0" width="1280" height="400" fill="url(#dotGrid)"/>

    <!-- corner marks -->
    <g stroke="#6C8EFF" stroke-width="1.3" fill="none" opacity="0">
      <animate attributeName="opacity" begin="0.3s" dur="1.4s" fill="freeze" values="0;0.6"/>
      <path d="M 56 84 L 56 56 L 84 56"/>
      <path d="M 1196 344 L 1224 344 L 1224 316"/>
    </g>

    <!-- monogram -->
    <g opacity="0">
      <animate attributeName="opacity" begin="0.35s" dur="1s" fill="freeze" values="0;1"/>
      <circle cx="1162" cy="88" r="32" fill="none" stroke="#6C8EFF" stroke-width="1.2" opacity="0.6"/>
      <circle cx="1162" cy="88" r="26" fill="none" stroke="#6C8EFF" stroke-width="0.6" opacity="0.35"/>
      <text x="1162" y="94" text-anchor="middle" font-size="15" letter-spacing="2" font-weight="600" fill="#EAF0FF" font-family="'Segoe UI',Arial,sans-serif">KSG</text>
    </g>

    <!-- eyebrow -->
    <g opacity="0">
      <animate attributeName="opacity" begin="0.15s" dur="0.7s" fill="freeze" values="0;1"/>
      <text x="92" y="112" font-size="13" letter-spacing="5.5" fill="#6C8EFF" font-family="'Segoe UI',Arial,sans-serif" font-weight="600">SOFTWARE ENGINEER</text>
    </g>

    <!-- name -->
    <g opacity="0" transform="translate(0,14)">
      <animate attributeName="opacity" begin="0.42s" dur="0.9s" fill="freeze" values="0;1"/>
      <animateTransform attributeName="transform" type="translate" begin="0.42s" dur="0.9s" fill="freeze" values="0,14;0,0" calcMode="spline" keySplines="0.2 0 0.15 1" keyTimes="0;1"/>
      <text x="90" y="185" font-size="60" fill="#EAF0FF" font-family="Georgia,'Times New Roman',serif" letter-spacing="0.5">Kavya Sree Gavirineni</text>
    </g>

    <!-- signature underline -->
    <path d="M 92 208 C 232 222, 372 196, 522 210" fill="none" stroke="url(#sigGrad)" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="480" stroke-dashoffset="480">
      <animate attributeName="stroke-dashoffset" begin="1.05s" dur="1.1s" fill="freeze" values="480;0" calcMode="spline" keySplines="0.25 0 0.15 1" keyTimes="0;1"/>
    </path>

    <!-- role subtitle -->
    <g opacity="0">
      <animate attributeName="opacity" begin="1.55s" dur="0.7s" fill="freeze" values="0;1"/>
      <text x="92" y="254" font-size="14" letter-spacing="3" fill="#8FADEB" font-family="'Segoe UI',Arial,sans-serif" font-weight="600">REACT.JS &#160;&#183;&#160; REACT NATIVE &#160;&#183;&#160; MERN STACK</text>
    </g>

    <!-- description -->
    <g opacity="0">
      <animate attributeName="opacity" begin="1.7s" dur="0.7s" fill="freeze" values="0;1"/>
      <text x="92" y="284" font-size="15" fill="#8891AD" font-family="'Segoe UI',Arial,sans-serif">Building production-ready web &amp; mobile products for e-commerce, EdTech and B2B SaaS.</text>
    </g>

    <!-- divider above stats -->
    <line x1="92" y1="318" x2="1188" y2="318" stroke="#22335E" stroke-width="1" opacity="0">
      <animate attributeName="opacity" begin="1.8s" dur="0.6s" fill="freeze" values="0;1"/>
    </line>

    
      <g opacity="0">
        <animate attributeName="opacity" begin="1.85s" dur="0.6s" fill="freeze" values="0;1"/>
        <text x="92.0" y="354" font-size="26" font-weight="700" fill="#EAF0FF" font-family="'DM Sans','Segoe UI',Arial,sans-serif">10+</text>
        <text x="92.0" y="374" font-size="11" letter-spacing="1.6" fill="#6C8EFF" font-family="'Segoe UI',Arial,sans-serif">MVPS SHIPPED</text>
      </g>
<line x1="366.0" y1="326" x2="366.0" y2="366" stroke="#22335E" stroke-width="1"/>
      <g opacity="0">
        <animate attributeName="opacity" begin="1.9700000000000002s" dur="0.6s" fill="freeze" values="0;1"/>
        <text x="390.0" y="354" font-size="26" font-weight="700" fill="#EAF0FF" font-family="'DM Sans','Segoe UI',Arial,sans-serif">1+ YR</text>
        <text x="390.0" y="374" font-size="11" letter-spacing="1.6" fill="#6C8EFF" font-family="'Segoe UI',Arial,sans-serif">EXPERIENCE</text>
      </g>
<line x1="640.0" y1="326" x2="640.0" y2="366" stroke="#22335E" stroke-width="1"/>
      <g opacity="0">
        <animate attributeName="opacity" begin="2.09s" dur="0.6s" fill="freeze" values="0;1"/>
        <text x="664.0" y="354" font-size="26" font-weight="700" fill="#EAF0FF" font-family="'DM Sans','Segoe UI',Arial,sans-serif">4</text>
        <text x="664.0" y="374" font-size="11" letter-spacing="1.6" fill="#6C8EFF" font-family="'Segoe UI',Arial,sans-serif">AGILE TEAM SIZE</text>
      </g>
<line x1="914.0" y1="326" x2="914.0" y2="366" stroke="#22335E" stroke-width="1"/>
      <g opacity="0">
        <animate attributeName="opacity" begin="2.21s" dur="0.6s" fill="freeze" values="0;1"/>
        <text x="938.0" y="354" font-size="26" font-weight="700" fill="#EAF0FF" font-family="'DM Sans','Segoe UI',Arial,sans-serif">8.53</text>
        <text x="938.0" y="374" font-size="11" letter-spacing="1.6" fill="#6C8EFF" font-family="'Segoe UI',Arial,sans-serif">CGPA</text>
      </g>

    <rect x="0.5" y="0.5" width="1279" height="399" rx="21.5" fill="none" stroke="#1C2B52" stroke-width="1"/>
  </g>
</svg>